name = "charmnest"
main = "src/cloudflare/worker.mjs"
compatibility_date = "2026-07-01"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "charmnest"
database_id = "SET_DURING_PROVIDER_ACTIVATION"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "charmnest-media"

[vars]
APP_ENV = "production"
PUBLIC_SITE_NAME = "CharmNest"
