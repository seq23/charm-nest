<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Custom buttons and pins</title>
  <desc id="desc">A pastel display of round custom event buttons and a silver pin back without any faces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0f7"/>
      <stop offset="1" stop-color="#e9ddff"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fc1"/>
      <stop offset="1" stop-color="#f83f91"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f8eb"/>
      <stop offset="1" stop-color="#9ce7ca"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" rx="70" fill="url(#bg)"/>
  <circle cx="160" cy="130" r="36" fill="#ffd166" opacity=".75"/>
  <circle cx="1060" cy="160" r="52" fill="#ffacd0" opacity=".55"/>
  <circle cx="1080" cy="760" r="80" fill="#d9f8eb" opacity=".8"/>
  <g>
    <g transform="translate(135 205) rotate(-10 190 190)">
      <circle cx="190" cy="190" r="170" fill="#fff" stroke="#f8d7e7" stroke-width="18"/>
      <circle cx="190" cy="190" r="145" fill="url(#pink)"/>
      <path d="M112 170h156M112 215h156" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity=".55"/>
      <text x="190" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">CLASS OF</text>
      <text x="190" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="72" font-weight="900" fill="#fff">2026</text>
    </g>
    <g transform="translate(445 90) rotate(8 170 170)">
      <circle cx="170" cy="170" r="152" fill="#fff" stroke="#d7eee5" stroke-width="16"/>
      <circle cx="170" cy="170" r="128" fill="url(#mint)"/>
      <path d="M96 120c42-44 106-44 148 0M96 220c42 44 106 44 148 0" fill="none" stroke="#5a2143" stroke-width="10" stroke-linecap="round" opacity=".45"/>
      <text x="170" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#5a2143">CELEBRATE</text>
      <text x="170" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#7b2f59">YOUR MOMENT</text>
      <circle cx="110" cy="85" r="12" fill="#ffd166"/>
      <circle cx="232" cy="252" r="14" fill="#f83f91"/>
      <circle cx="260" cy="105" r="9" fill="#9d7df2"/>
    </g>
    <g transform="translate(760 250) rotate(-4 170 170)">
      <circle cx="170" cy="170" r="155" fill="#fff" stroke="#eadde5" stroke-width="16"/>
      <circle cx="170" cy="170" r="130" fill="#5a2143"/>
      <path d="M104 114c42 18 90 18 132 0M104 226c42-18 90-18 132 0" fill="none" stroke="#ffacd0" stroke-width="10" stroke-linecap="round"/>
      <text x="170" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">IN LOVING</text>
      <text x="170" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">MEMORY</text>
    </g>
  </g>
  <g transform="translate(370 560)">
    <ellipse cx="245" cy="132" rx="230" ry="120" fill="#d4d4d8" stroke="#a8a8ad" stroke-width="12"/>
    <ellipse cx="245" cy="132" rx="200" ry="92" fill="#ececf0"/>
    <path d="M112 130h266" stroke="#8b8b92" stroke-width="15" stroke-linecap="round"/>
    <path d="M126 130c22-64 216-64 238 0" fill="none" stroke="#6f7077" stroke-width="12"/>
    <circle cx="126" cy="130" r="16" fill="#75767c"/>
    <circle cx="364" cy="130" r="16" fill="#75767c"/>
    <path d="M364 130l72-24-20 32 20 30z" fill="#8c8d94"/>
    <text x="245" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#5a2143">ROUND PIN-BACK BUTTONS</text>
  </g>
  <g fill="#f83f91" opacity=".7">
    <path d="M86 710l12 25 28 4-20 20 5 28-25-13-25 13 5-28-20-20 28-4z"/>
    <path d="M1050 470l10 20 22 3-16 16 4 22-20-10-20 10 4-22-16-16 22-3z"/>
